name: Resume Screening CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Code Formatting (Black)
        run: |
          black --check .

      - name: Run Flake8 Linter
        run: |
          flake8 .

      - name: Run Unit Tests
        run: |
          pytest

      - name: Build Docker Image
        run: |
          docker build -t resume-screening .

      - name: Start Docker Container
        run: |
          docker run -d \
            --name resume-screening-container \
            -p 8000:8000 \
            resume-screening

      - name: Wait for Application to Start
        run: |
          sleep 15

      - name: Verify Running Containers
        run: |
          docker ps

      - name: Check Application Health
        run: |
          curl --fail http://localhost:8000/docs

      - name: Show Docker Logs (if failure)
        if: failure()
        run: |
          docker logs resume-screening-container

      - name: Stop and Remove Container
        if: always()
        run: |
          docker stop resume-screening-container || true
          docker rm resume-screening-container || true